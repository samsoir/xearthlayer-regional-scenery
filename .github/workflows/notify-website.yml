name: Notify Website of Package Updates

on:
  push:
    branches:
      - main
    # Each library generation (v1/, v2/, ...) has its own index. The root
    # index is the pre-0.5 library, frozen; it is still watched so the
    # website rehosts it should it ever change.
    paths:
      - 'xearthlayer_package_library.txt'
      - 'v*/xearthlayer_package_library.txt'
      - 'v*/region_metadata.json'
      - 'v*/coverage.png'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website sync
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: samsoir/xearthlayer-website
          event-type: package-library-updated
          client-payload: '{"source": "xearthlayer-regional-scenery"}'
